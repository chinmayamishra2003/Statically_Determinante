<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statically Determinate · IES Civil Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--card:#fff;--ink:#14213d;--mut:#6b7b92;--line:#e3e9f2;
  --acc:#1f4e8c;--hi:#e8a317;--ok:#2f8f5b;--urg:#b0281b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1522;--card:#16202f;--ink:#e6ecf5;--mut:#92a3bb;--line:#2a3a52;
    --acc:#6aa5ee;--hi:#f0b93a;--ok:#4cc58a;--urg:#ff8b7a;
    color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#0e1522;--card:#16202f;--ink:#e6ecf5;--mut:#92a3bb;--line:#2a3a52;
  --acc:#6aa5ee;--hi:#f0b93a;--ok:#4cc58a;--urg:#ff8b7a;
  color-scheme:dark
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Source Serif 4',Georgia,serif}
h1,h2,h3,.sans,button,nav a,label,select,input,textarea{font-family:Archivo,system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:2px solid var(--ink);background:var(--card);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.mark{font:800 22px Archivo,sans-serif;border:2px solid var(--ink);padding:2px 9px;background:var(--hi);color:#14213d}
.logo b{display:block;font:800 20px/1.1 Archivo,sans-serif;letter-spacing:-.01em}
.logo small{font:500 12px Archivo,sans-serif;color:var(--mut)}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav a{padding:7px 12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent}
nav a.on{border-color:var(--hi)}
nav a:hover{background:var(--bg)}
#tt{background:transparent;border:1px solid var(--ink);color:var(--ink);padding:7px 12px;font:600 13px Archivo,sans-serif;cursor:pointer;margin-left:8px;white-space:nowrap}
#tt:hover{background:var(--bg)}
main{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
h2{font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
button,.btn{background:var(--ink);color:var(--bg);border:0;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 3px}
.bar{height:8px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1 1 150px}
details{border:1px solid var(--line);background:var(--card);margin-bottom:8px}
summary{padding:10px 14px;font:700 16px Archivo,sans-serif;cursor:pointer}
details>div{padding:4px 14px 12px}
.t{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.t input{width:auto;margin-top:6px}
.f{font-family:'Source Serif 4',serif;background:var(--bg);padding:6px 10px;margin:5px 0;border-left:3px solid var(--hi);overflow-x:auto}
.tag{font:600 12px Archivo,sans-serif;background:var(--bg);border:1px solid var(--line);padding:1px 7px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;font-size:14px}

/* Countdown */
.countdowns{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;margin-bottom:18px
}
.countdown{
  background:var(--card);border:1px solid var(--line);
  padding:18px 14px 16px;text-align:center;
  transition:border-color .2s, box-shadow .2s, opacity .2s
}
.countdown.is-next{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.countdown.is-past{opacity:.55}
.cd-label{
  font:700 12px Archivo,sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut);margin-bottom:12px
}
.cd-num{
  font:800 56px/1 Archivo,sans-serif;color:var(--ink);
  letter-spacing:-.02em;font-variant-numeric:tabular-nums
}
.cd-sub{
  font:600 12px Archivo,sans-serif;color:var(--mut);
  margin-top:8px;text-transform:uppercase;letter-spacing:.08em
}
.cd-done{font:700 16px Archivo,sans-serif;color:var(--ok);padding:26px 0}
.countdown.urgent .cd-num{color:var(--urg)}
@media (max-width:520px){
  .cd-num{font-size:44px}
}

/* Formula images */
.fimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.fimg{margin:0;border:1px solid var(--line);padding:4px;background:var(--bg);break-inside:avoid}
.fimg img{width:100%;height:auto;display:block;background:#fff}
.fimg figcaption{font:600 12px Archivo,sans-serif;color:var(--mut);padding:4px 2px}
.fimg button{font-size:12px;padding:3px 8px;margin:2px}
.addimg[hidden]{display:none}

/* QCAB */
#out{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:16px}
.sheet{width:210mm;height:297mm;background:#fff;color:#111;position:relative;box-shadow:0 1px 8px rgba(0,0,0,.25);overflow:hidden;font-family:'Source Serif 4',serif;flex:none}
.sheet .lines{position:absolute;left:25mm;right:12mm;top:36mm;bottom:14mm;background:repeating-linear-gradient(to bottom,transparent 0 7.4mm,#9db4cf 7.4mm 7.55mm)}
.sheet .m1,.sheet .m2{position:absolute;top:0;bottom:0;width:.3mm;background:#c0392b}
.sheet .m1{left:24mm}
.sheet .m2{left:25mm}
.sheet .rm{position:absolute;right:12mm;top:0;bottom:0;width:.3mm;background:#c0392b}
.sheet .hd{position:absolute;left:25mm;right:12mm;top:10mm;height:22mm;border-bottom:.4mm solid #111;font:600 10pt Archivo,sans-serif;display:flex;flex-direction:column;justify-content:space-between}
.sheet .hd div{display:flex;justify-content:space-between;gap:8px}
.sheet .q{font:600 11pt/1.4 'Source Serif 4',serif;position:absolute;left:27mm;right:14mm;top:36mm;z-index:2;background:#fff;padding:1.5mm 2mm;border:.3mm solid #111;margin-bottom:2mm}
.sheet .pn{position:absolute;bottom:5mm;width:100%;text-align:center;font:500 9pt Archivo,sans-serif}
@media print{
  @page{size:A4;margin:0}
  header,nav,.noprint,.sub,h2{display:none!important}
  body,main{background:#fff;padding:0;margin:0;max-width:none}
  .view:not(#v-qcab){display:none!important}
  #out{margin:0;gap:0;display:block}
  .sheet{box-shadow:none;page-break-after:always;break-after:page}
}
</style>
</head>

  <a class="logo" href="#dash">
    <span class="mark">ΣF</span>

<script>
/* ---- Theme toggle (light default, dark persists) ---- */
(function(){
  try{
    var saved = localStorage.getItem('theme');
    if(saved === 'dark' || saved === 'light'){
      document.documentElement.setAttribute('data-theme', saved);
    }
  }catch(e){}
})();
function currentTheme(){
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}
function updateThemeBtn(){
  var b = document.getElementById('tt');
  if(!b) return;
  b.textContent = currentTheme() === 'dark' ? '☀ Light' : '🌙 Dark';
}
document.getElementById('tt').addEventListener('click', function(){
  var next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('theme', next); }catch(e){}
  updateThemeBtn();
});

/* ---- Subjects data ---- */
const SUB=[
{n:"Building Materials & Construction",t:"Timber, bricks, stones, lime, cement & admixtures;Cement concrete: mix design, workability, strength, durability;Steel, aluminium, glass, plastics, bitumen, paints;Masonry, plastering, flooring, roofing;Building services basics",note:"Concrete strength depends mainly on w/c ratio (Abrams). Know IS 10262 mix design steps and curing effects.",f:["Abrams: fc = A / B^(w/c)","Modulus of rupture fcr = 0.7√fck (MPa)","Ec = 5000√fck (MPa)","Young’s modulus of steel Es = 2×10⁵ MPa"]},
{n:"Solid Mechanics",t:"Elastic constants, stress-strain, thermal stresses;Principal stresses & Mohr’s circle;Bending & shear stress in beams;Torsion of shafts;Columns & struts, Euler/Rankine;Thin & thick cylinders;Theories of failure;Strain energy, unsymmetrical bending, shear centre",note:"Draw Mohr’s circle neatly with sign convention stated. Always check slenderness before choosing Euler vs Rankine.",f:["σ = My/I , τ = VAȲ/(Ib)","E = 2G(1+μ) = 3K(1−2μ)","Euler: Pcr = π²EI/Le²","T/J = τ/r = Gθ/L","τmax = √(((σx−σy)/2)²+τxy²)","Thin cylinder: σh = pd/2t , σl = pd/4t"]},
{n:"Structural Analysis",t:"Determinacy & stability, trusses;Moment distribution, slope-deflection;Stiffness & flexibility matrix methods;Influence lines & moving loads;Arches & cables;Energy methods, Castigliano, unit load;Plastic analysis of beams & frames",note:"Choose the method by degree of indeterminacy: kinematic DoF small → slope-deflection/stiffness; static DoF small → force method.",f:["Ds = 3m + r − 3j (plane truss: m+r−2j)","Slope-deflection: M = 4EIθ/L + FEM","Distribution factor = k/Σk","δ = ∫ M m dx / EI (unit load)","Plastic: Mp = σy·Z , shape factor = Z/S"]},
{n:"Design of Steel Structures",t:"Limit state method (IS 800), bolted & welded connections;Tension members, compression members;Beams, plate girders, gantry girders;Industrial roofs, trusses, purlins;Column bases, eccentric connections",note:"Check shear lag and block shear in tension members; effective length & buckling class for compression members.",f:["Bolt shear Vnsb = fu/√3 (nn Anb + ns Asb)/γmb","Tdg = Ag fy/γm0","Weld strength = fu/(√3 γmw) × throat × length","Pd = Ae fcd"]},
{n:"Design of Concrete & Masonry",t:"Limit state design: flexure, shear, torsion, bond (IS 456);Singly/doubly reinforced & flanged beams;Slabs: one-way, two-way, flat;Columns, footings;Prestressed concrete: losses, analysis;Masonry design",note:"Always write xu,max/d limits and state assumptions. Prestress losses table is a frequent short question.",f:["Mu = 0.87 fy Ast d (1 − Ast fy/(b d fck))","xu,max/d = 0.48 (Fe415), 0.46 (Fe500)","τv = Vu/(bd)","Ld = φ·0.87fy/(4τbd)","Pu = 0.4 fck Ac + 0.67 fy Asc"]},
{n:"Construction Planning & Management",t:"CPM & PERT, crashing, resource levelling;Equipment: earthmoving, cranes, concreting;Contracts, tendering, arbitration;Quality, safety, estimation & costing;Engineering economics, EVM",note:"Network problems: always state critical path, floats and project duration clearly in a table.",f:["TF = LFT − EFT − duration","PERT te = (to + 4tm + tp)/6","σ² = ((tp − to)/6)²","SPI = EV/PV , CPI = EV/AC"]},
{n:"Fluid Mechanics & Hydraulic Machines",t:"Fluid statics, kinematics, Bernoulli;Momentum equation, boundary layer;Pipe flow, pipe networks, water hammer;Open channel flow: uniform, GVF, hydraulic jump;Turbines & pumps, dimensional analysis",note:"Open channel: classify profile (M1, S2…) before computing. Always apply energy and momentum equations in the right place.",f:["Q = A V , Bernoulli: p/γ + V²/2g + z = const","Manning: V = (1/n) R^(2/3) S^(1/2)","Froude Fr = V/√(gD)","Hydraulic jump: y2/y1 = ½(√(1+8Fr1²) − 1)","hf = f L V²/(2 g d)","P = γ Q H"]},
{n:"Hydrology & Irrigation",t:"Rainfall-runoff, hydrographs, unit hydrograph;Flood routing, flood frequency;Groundwater, well hydraulics;Crop water requirement, canal design;Gravity dams, spillways, weirs, Khosla’s theory",note:"Unit hydrograph steps: separate baseflow, find ERH, ordinates by dividing DRH by depth. Regime theory for canals: Kennedy vs Lacey.",f:["Rational: Q = CiA/360 (A in ha)","Duty D = 8.64 B/Δ","Dupuit (unconfined): Q = πk(h2²−h1²)/ln(r2/r1)","Lacey: V = (Qf²/140)^(1/6)","Gravity dam: FOS sliding = μΣV/ΣH"]},
{n:"Environmental Engineering",t:"Water demand, sources, quality standards;Treatment: coagulation, sedimentation, filtration, disinfection;Sewage characteristics, BOD, DO sag;Wastewater treatment: ASP, trickling filter, sludge;Solid waste management;Air & noise pollution, ecology, EIA",note:"Always give design numbers (SOR, detention time, loading) with units. DO sag curve questions need the critical deficit steps.",f:["BODt = L0(1 − e^(−kt))","Overflow rate = Q/A","Detention time t = V/Q","Population forecast: geometric Pn = P0(1+r)^n","Streeter-Phelps critical time tc = (1/(kr−kd)) ln[...]"]},
{n:"Soil Mechanics & Foundation",t:"Index properties, classification (IS);Permeability, seepage, flow nets;Compaction, consolidation, settlement;Shear strength, Mohr-Coulomb;Earth pressure, slope stability;Bearing capacity, pile & well foundations, ground improvement",note:"State drainage conditions (UU, CU, CD). Compare Rankine vs Coulomb. Consolidation: use Terzaghi’s Tv and Cc correctly.",f:["e = wGs/S , γd = Gγw/(1+e)","τ = c + σ′ tanφ","Terzaghi: qu = cNc + γDNq + 0.5γBNγ","Sc = Cc H/(1+e0) log(σ′f/σ′0)","Ka = (1−sinφ)/(1+sinφ)","Tv = cv t/Hdr²"]},

/* ---- Exam dates (IST calendar) ---- */
const EXAMS=[
  {name:"Prelims", date:"2027-01-31", label:"31 Jan 2027"},
  {name:"Mains",   date:"2027-06-18", label:"18 Jun 2027"}
];

const STAGES={pre:"Stage I (Prelims)",c:"Stage II Conventional"};
const SYLL_NOTE="Structure: Stage I: GS & Engineering Aptitude (200) + Civil Engg Paper I & II (200 each), objective. Stage II: Civil Engg Paper I & II (300 each, conventional, 3 hrs). Stage III: Personality test (200). Topics are grouped by subject here; always cross-check with the latest UPSC notification.";
const INT=[1,3,7,21,45,90];
const iso=d=>d.toISOString().slice(0,10);
const today=()=>iso(new Date());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st;try{st=JSON.parse(localStorage.getItem('sd')||'{}')}catch(e){st={}}
st.done=st.done||{};
st.pyq=st.pyq||[];
st.exam=st.exam||"";
const save=()=>{try{localStorage.setItem('sd',JSON.stringify(st))}catch(e){}};
const TABS=[["dash","Dashboard"],["syl","Syllabus"],["notes","Notes"],["form","Formulas"],["pyq","PYQ"],["rev","Revision"],["qcab","QCAB"],["sync","Sync"]];
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return iso(x)};

/* ---- IST days-remaining helpers ---- */
function istDateStr(d){
  const parts = new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Kolkata", year:"numeric", month:"2-digit", day:"2-digit"
  }).formatToParts(d);
  const y = parts.find(p=>p.type==='year').value;
  const m = parts.find(p=>p.type==='month').value;
  const dd = parts.find(p=>p.type==='day').value;
  return y+"-"+m+"-"+dd;
}
function daysUntilIST(targetISO){
  const a = Date.parse(istDateStr(new Date())+"T00:00:00Z");
  const b = Date.parse(targetISO+"T00:00:00Z");
  return Math.round((b-a)/86400000);
}

function dueList(){
  const o=[];
  SUB.forEach((s,i)=>s.t.split(";").forEach((t,j)=>{
    const r=st.done[i+"."+j];
    if(r){
      const due=addDays(r.d,INT[Math.min(r.s,INT.length-1)]);
      o.push({i,j,t,s:s.n,due,od:due<=today()});
    }
  }));
  return o.sort((a,b)=>a.due<b.due?-1:1);
}
function pct(i){
  const n=SUB[i].t.split(";").length;
  let c=0;
  for(let j=0;j<n;j++) if(st.done[i+"."+j]) c++;
  return [c,n];
}

function renderCountdowns(){
  const counts = EXAMS.map(e => ({name:e.name, label:e.label, d:daysUntilIST(e.date)}));
  const upcoming = counts.filter(x=>x.d>0).sort((a,b)=>a.d-b.d);
  const nearest = upcoming.length ? upcoming[0].name : null;
  return counts.map(x=>{
    const done   = x.d <= 0;
    const urgent = x.d > 0 && x.d < 30;
    const isNext = x.name === nearest;
    return `<div class="countdown ${done?'is-past':''} ${urgent?'urgent':''} ${isNext?'is-next':''}">
      <div class="cd-label">${x.name} · ${x.label}</div>
      ${done
        ? `<div class="cd-done">${x.name} is here — all the best!</div>`
        : `<div class="cd-num">${x.d}</div><div class="cd-sub">Days to go · IST</div>`}
    </div>`;
  }).join("");
}

const V={
dash(){
  let tc=0,td=0;
  const rows=SUB.map((s,i)=>{
    const[c,n]=pct(i);tc+=c;td+=n;
    return`<div class="card"><b class="sans">${esc(s.n)}</b><div class="bar"><i style="width:${c/n*100}%"></i></div><small>${c} of ${n} topics studied</small></div>`
  }).join("");
  const due=dueList().filter(x=>x.od).length;
  const dl=st.exam?Math.ceil((new Date(st.exam)-new Date(today()))/864e5):null;
  return `<h2>Dashboard</h2>
    <p class="sub">Your IES civil preparation at a glance. Countdowns use Indian Standard Time (Asia/Kolkata).</p>
    <div class="countdowns">${renderCountdowns()}</div>
    <div class="grid">
      <div class="card"><h3>${tc}/${td}</h3>topics studied (${Math.round(tc/td*100)}%)</div>
      <div class="card"><h3>${due}</h3>revisions due <a href="#rev">Open revision</a></div>
      <div class="card"><label>Custom deadline (optional)</label><input type="date" id="exam" value="${st.exam}">${dl!==null?`<h3>${dl} days left</h3>`:""}</div>
    </div>
    <h3>Subject progress</h3>
    <div class="grid">${rows}</div>`;
},
syl(){
  return `<h2>IES Civil Syllabus</h2><p class="sub">${SYLL_NOTE}</p>`+
    SUB.map((s,i)=>`<details><summary>${esc(s.n)} (${pct(i)[0]}/${pct(i)[1]})</summary><div>${
      s.t.split(";").map((t,j)=>`<label class="t" style="font-weight:400;color:inherit;margin:0"><input type="checkbox" data-t="${i}.${j}" ${st.done[i+"."+j]?"checked":""}> ${esc(t)}</label>`).join("")
    }</div></details>`).join("")+
    `<p class="sub">Ticking a topic adds it to your revision schedule (1, 3, 7, 21, 45, 90 days).</p>`;
},
notes(){
  return `<h2>Short notes</h2><p class="sub">One-minute summary per subject.</p><div class="grid">${
    SUB.map(s=>`<div class="card"><h3>${esc(s.n)}</h3><p>${esc(s.note)}</p></div>`).join("")
  }</div>`;
},
form(){
  return `<h2>Formula sheet</h2><p class="sub">Search or print this page. Images are stored in the public library, so everyone sees them.</p>
    <div class="row noprint"><input id="fq" placeholder="Search formulas or image captions"><button onclick="print()">Print sheet</button></div>
    <p id="fm" class="sub noprint"></p><input type="file" id="fi" accept="image/*" hidden>
    <div class="grid" id="fg">${SUB.map((s,i)=>`<div class="card fc"><h3>${esc(s.n)}</h3>${s.f.map(x=>`<div class="f">${esc(x)}</div>`).join("")}<div class="fimgs" data-sub="${i}"></div><button class="alt noprint addimg" data-add="${i}" hidden>+ Add image</button></div>`).join("")}</div>`;
},
pyq(){
  const sel=SUB.map((s,i)=>`<option value="${i}">${esc(s.n)}</option>`).join("");
  return `<h2>Previous year questions</h2><p class="sub">Add questions from the official papers and track which ones you have solved. Import a CSV or JSON in Sync.</p>
    <div class="card"><div class="row">
      <div><label>Year</label><input id="py" type="number" value="2024"></div>
      <div><label>Paper</label><select id="pp"><option>Prelims</option><option>Mains P1</option><option>Mains P2</option></select></div>
      <div><label>Marks</label><select id="pm"><option>6</option><option>8</option><option>12</option><option>20</option><option>2</option></select></div>
      <div><label>Subject</label><select id="ps">${sel}</select></div>
    </div>
    <label>Question</label><textarea id="pt" rows="3"></textarea>
    <p><button id="padd">Add question</button></p></div>
    <div class="row noprint"><input id="pf" placeholder="Filter by text, year, subject"></div>
    <div class="scroll"><table id="pl"></table></div>`;
},
rev(){
  const l=dueList();
  return `<h2>Revision</h2><p class="sub">Topics come back on a spaced schedule. Mark one revised to push it further out.</p>`+
    (l.length
      ? `<div class="scroll"><table><tr><th>Topic</th><th>Subject</th><th>Due</th><th></th></tr>${
          l.map(x=>`<tr><td>${esc(x.t)}</td><td>${esc(x.s)}</td><td>${x.od?'<span class="tag" style="border-color:var(--hi)">due</span>':x.due}</td><td><button class="alt" data-r="${x.i}.${x.j}">Revised</button></td></tr>`).join("")
        }</table></div>`
      : `<div class="card">Nothing scheduled yet. Tick topics in <a href="#syl">Syllabus</a> as you finish them.</div>`);
},

    <div class="card noprint"><div class="row">
      <div><label>Marks</label><select id="qm"><option value="6">6 marks (2 pages)</option><option value="8">8 marks (2 pages)</option><option value="12">12 marks (3 pages)</option><option value="20">20 marks (4 pages)</option></select></div>
      <div><label>Question no.</label><input id="qn" value="1"></div>

    <small>In the print dialog set margins to None and turn off headers and footers.</small></div>
    <div id="out"></div>`;
},
sync(){
  return `<h2>Sync and backup</h2><p class="sub">Free options, no server needed.</p>
    <div class="card"><h3>1. File backup</h3>
      <p>Export a JSON file and keep it in Google Drive or your repo. Import it on any device.</p>
      <p class="row"><button id="ex">Export data</button><input type="file" id="im" accept=".json"></p></div>
    <div class="card"><h3>2. GitHub Gist sync (free)</h3>
      <p>Create a token with only the <b>gist</b> scope at github.com/settings/tokens. This works when the site runs on your own domain such as GitHub Pages.</p>
      <label>Token</label><input id="gt" type="password" value="${esc(st.gt||"")}">
      <label>Gist id (blank for first push)</label><input id="gi" value="${esc(st.gi||"")}">
      <p class="row"><button id="gp">Push</button><button class="alt" id="gl">Pull</button></p>
      <p id="gm" class="sub"></p></div>
    <div class="card"><h3>3. Public cloud library (images and shared data)</h3>
      <p>Uses this GitHub repo as free public storage, so every visitor can see the images. Only you can add or delete: create a fine-grained token at github.com/settings/personal-access-tokens for this repo only, with Contents: Read and write. The token stays in this browser and is never exported.</p>
      <label>Repo (owner/name)</label><input id="cr" value="${esc(CFG().repo)}">
      <label>Branch</label><input id="cb" value="${esc(CFG().branch)}">
      <label>Token</label><input id="ct" type="password" value="${esc(CFG().tok)}">
      <p class="row"><button id="cs">Save</button><button class="alt" id="cp">Publish my PYQs</button><button class="alt" id="cl">Load shared PYQs</button></p>
      <p id="cm" class="sub"></p></div>
    <div class="card"><h3>4. Later upgrade</h3>For live multi-device sync with login, Supabase or Firebase free tiers work well.</div>`;
}};

/* ---- Cloud library: the public GitHub repo is the free storage ---- */
const CFG=()=>Object.assign({repo:"chinmayamishra2003/Statically_Determinante",branch:"main",tok:""},st.cloud||{});
let LIB={items:[],sha:null};const PREV={};
const ghH=()=>({Authorization:"Bearer "+CFG().tok,Accept:"application/vnd.github+json"});
const api=p=>"https://api.github.com/repos/"+CFG().repo+"/contents/"+p;
const b64=t=>{let b="";new TextEncoder().encode(t).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
const unb64=t=>new TextDecoder().decode(Uint8Array.from(atob(t.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const fmsg=t=>{const e=document.querySelector("#fm");if(e)e.textContent=t};
async function ghPut(path,content,sha,message){
  const r=await fetch(api(path),{method:"PUT",headers:ghH(),body:JSON.stringify({message,content,branch:CFG().branch,...(sha?{sha}:{})})});
  const j=await r.json();
  if(!r.ok){const e=new Error(j.message||r.status);e.status=r.status;throw e}
  return j;
}
async function loadLib(){
  try{
    if(CFG().tok){
      const r=await fetch(api("data/library.json")+"?ref="+CFG().branch,{headers:ghH()});
      if(r.status==404){LIB={items:[],sha:null};return}
      const j=await r.json(); if(!r.ok)throw new Error(j.message);
      LIB={items:JSON.parse(unb64(j.content)).items||[],sha:j.sha};
    }else{
      const r=await fetch("data/library.json?t="+Date.now());
      LIB={items:r.ok?((await r.json()).items||[]):[],sha:null};
    }
  }catch(e){fmsg("Could not load library: "+e.message)}
}
async function saveLib(fn){
  for(let n=0;n<2;n++){
    await loadLib();
    const items=fn(LIB.items.slice());
    try{
      const j=await ghPut("data/library.json",b64(JSON.stringify({v:1,items})),LIB.sha,"Update library");
      LIB={items,sha:j.content.sha};return;
    }catch(e){if(n||e.status!=409)throw e}
  }
}
function shrink(file,max=1600){
  return new Promise((ok,no)=>{
    const im=new Image(),u=URL.createObjectURL(file);
    im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.85));
    };
    im.onerror=()=>no(new Error("Could not read this image"));im.src=u;
  });
}
async function addImg(file,sub,title){
  const url=await shrink(file),id=Date.now().toString(36),path="uploads/formulas/"+id+".jpg";
  await ghPut(path,url.split(",")[1],null,"Add formula image");
  PREV[id]=url;
  await saveLib(a=>a.concat({id,sub,title,path,t:today()}));
}
async function delImg(id){
  const x=LIB.items.find(i=>i.id==id);if(!x)return;
  const r=await fetch(api(x.path)+"?ref="+CFG().branch,{headers:ghH()});
  if(r.ok){
    const j=await r.json();
    const d=await fetch(api(x.path),{method:"DELETE",headers:ghH(),body:JSON.stringify({message:"Delete formula image",sha:j.sha,branch:CFG().branch})});
    if(!d.ok)throw new Error((await d.json()).message);
  }
  await saveLib(a=>a.filter(i=>i.id!=id));
}
function drawImgs(){
  const owner=!!CFG().tok;
  document.querySelectorAll(".fimgs").forEach(box=>{
    box.innerHTML=LIB.items.filter(x=>x.sub==box.dataset.sub).map(x=>{
      const u=esc(PREV[x.id]||x.path);
      return `<figure class="fimg"><a href="${u}" target="_blank" rel="noopener"><img loading="lazy" src="${u}" alt="${esc(x.title||"Formula image")}"></a>${x.title?`<figcaption>${esc(x.title)}</figcaption>`:""}${owner?`<button class="alt noprint" data-del="${esc(x.id)}">Delete</button>`:""}</figure>`;
    }).join("");
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Delete this image for everyone?"))return;
    try{fmsg("Deleting…");await delImg(b.dataset.del);fmsg("");drawImgs()}catch(x){fmsg("Delete failed: "+x.message)}
  });
}
async function formLib(){
  const fi=document.querySelector("#fi");
  document.querySelectorAll(".addimg").forEach(b=>{b.hidden=!CFG().tok;b.onclick=()=>{fi.dataset.sub=b.dataset.add;fi.click()}});
  fi.onchange=async e=>{
    const f=e.target.files[0];e.target.value="";if(!f)return;
    const t=prompt("Caption for this image (optional)")||"";
    try{fmsg("Uploading…");await addImg(f,+fi.dataset.sub,t);fmsg("Uploaded. Other visitors see it after the site rebuilds (about a minute).");drawImgs()}
    catch(x){fmsg("Upload failed: "+x.message)}
  };
  fmsg("Loading images…");await loadLib();if(document.querySelector("#fm")&&document.querySelector("#fm").textContent=="Loading images…")fmsg("");drawImgs();
}

const $=s=>document.querySelector(s), $n=$("#nav"), $m=$("#main");

function nav(){
  const h=(location.hash||"#dash").slice(1);
  const k=V[h]?h:"dash";
  $n.innerHTML=TABS.map(([a,b])=>`<a href="#${a}" class="${a==k?"on":""}">${b}</a>`).join("");
  $m.innerHTML=`<section class="view" id="v-${k}">${V[k]()}</section>`;
  bind(k);
  window.scrollTo(0,0);
}

function bind(k){
  if(k=="dash") $("#exam").onchange=e=>{st.exam=e.target.value;save();nav()};

  if(k=="syl") document.querySelectorAll("[data-t]").forEach(c=>c.onchange=()=>{
    if(c.checked) st.done[c.dataset.t]={d:today(),s:0};
    else delete st.done[c.dataset.t];
    save();
  });

  if(k=="form"){
    $("#fq").oninput=e=>{
      const q=e.target.value.toLowerCase();
      document.querySelectorAll(".fc").forEach(c=>c.style.display=(c.textContent+" "+[...c.querySelectorAll("img")].map(i=>i.alt).join(" ")).toLowerCase().includes(q)?"":"none");
    };
    formLib();
  }

  if(k=="rev") document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const r=st.done[b.dataset.r]; r.d=today(); r.s++; save(); nav();
  });

  if(k=="pyq"){
    const draw=()=>{
      const q=($("#pf").value||"").toLowerCase();
      $("#pl").innerHTML="<tr><th>Year</th><th>Paper</th><th>Marks</th><th>Question</th><th>Solved</th><th></th></tr>"+
        st.pyq.map((p,i)=>({p,i}))
          .filter(({p})=>(p.y+p.pp+SUB[p.s].n+p.q).toLowerCase().includes(q))
          .map(({p,i})=>`<tr><td>${p.y}</td><td>${esc(p.pp)}</td><td>${p.m}</td><td>${esc(p.q)}<br><span class="tag">${esc(SUB[p.s].n)}</span></td><td><input type="checkbox" data-s="${i}" ${p.ok?"checked":""}></td><td><button class="alt" data-x="${i}">Delete</button></td></tr>`).join("");
      document.querySelectorAll("[data-s]").forEach(c=>c.onchange=()=>{st.pyq[c.dataset.s].ok=c.checked;save()});
      document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{st.pyq.splice(b.dataset.x,1);save();draw()});
    };
    $("#pf").oninput=draw;
    $("#padd").onclick=()=>{
      const q=$("#pt").value.trim(); if(!q)return;
      st.pyq.push({y:$("#py").value,pp:$("#pp").value,m:$("#pm").value,s:+$("#ps").value,q,ok:false});
      $("#pt").value=""; save(); draw();
    };
    draw();
  }

  if(k=="qcab") $("#qg").onclick=()=>{
    const m=+$("#qm").value, n={6:2,8:2,12:3,20:4}[m];
    let h="";
    for(let p=1;p<=n;p++) h+=`<div class="sheet"><i class="m1"></i><i class="m2"></i><i class="rm"></i><div class="hd"><div><span>${esc($("#qs").value)}</span><span>Roll No: ${esc($("#qr").value)||"__________"}</span></div><div><span>Q. ${esc($("#qn").value)}</span><span>${m} marks</span><span>Page ${p} of ${n}</span></div></div><div class="lines"></div>${p==1&&$("#qt").value.trim()?`<div class="q">${esc($("#qt").value)}</div>`:""}<div class="pn">${p} / ${n}</div></div>`;
    $("#out").innerHTML=h;
  };

  if(k=="sync"){
    $("#ex").onclick=()=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([JSON.stringify({...st,cloud:undefined,gt:undefined})],{type:"application/json"}));
      a.download="sd-backup-"+today()+".json";
      a.click();
    };
    $("#im").onchange=e=>{
      const r=new FileReader();
      r.onload=()=>{
        try{
          st=Object.assign({done:{},pyq:[],cloud:st.cloud},JSON.parse(r.result),{cloud:st.cloud});
          save(); $("#gm").textContent=""; alert("Imported");
        }catch(x){ alert("Not a valid backup file"); }
      };
      r.readAsText(e.target.files[0]);
    };
    const cm=t=>$("#cm").textContent=t;
    $("#cs").onclick=()=>{st.cloud={repo:$("#cr").value.trim(),branch:$("#cb").value.trim()||"main",tok:$("#ct").value.trim()};save();cm("Saved on this device.")};
    $("#cp").onclick=async()=>{
      try{
        if(!CFG().tok)throw new Error("save a token first");
        const r=await fetch(api("data/shared.json")+"?ref="+CFG().branch,{headers:ghH()});
        const sha=r.ok?(await r.json()).sha:null;
        await ghPut("data/shared.json",b64(JSON.stringify({v:1,pyq:st.pyq})),sha,"Publish shared PYQs");
        cm("Published. Visitors can load it after the site rebuilds.");
      }catch(e){cm("Failed: "+e.message)}
    };
    $("#cl").onclick=async()=>{
      try{
        const r=await fetch("data/shared.json?t="+Date.now());if(!r.ok)throw new Error("nothing published yet");
        const d=await r.json(),key=p=>[p.y,p.pp,p.q].join("|"),have=new Set(st.pyq.map(key));let n=0;
        (d.pyq||[]).forEach(p=>{if(SUB[p.s]&&!have.has(key(p))){st.pyq.push(p);n++}});
        save();cm(n+" new questions added.");
      }catch(e){cm("Failed: "+e.message)}
    };
    const msg=t=>$("#gm").textContent=t;
    const H=()=>({Authorization:"Bearer "+$("#gt").value,Accept:"application/vnd.github+json"});
    $("#gp").onclick=async()=>{
      try{
        st.gt=$("#gt").value;
        const body={description:"Statically Determinate backup",public:false,files:{"sd.json":{content:JSON.stringify({...st,gt:undefined,cloud:undefined})}}};
        const id=$("#gi").value;
        const r=await fetch("https://api.github.com/gists"+(id?"/"+id:""),{method:id?"PATCH":"POST",headers:H(),body:JSON.stringify(body)});
        const j=await r.json(); if(!r.ok) throw new Error(j.message);
        st.gi=j.id; save(); $("#gi").value=j.id; msg("Pushed. Gist id: "+j.id);
      }catch(e){ msg("Push failed: "+e.message); }
    };
    $("#gl").onclick=async()=>{
      try{
        const r=await fetch("https://api.github.com/gists/"+$("#gi").value,{headers:H()});
        const j=await r.json(); if(!r.ok) throw new Error(j.message);
        const d=JSON.parse(j.files["sd.json"].content);
        st=Object.assign(st,d); save(); msg("Pulled latest data.");
      }catch(e){ msg("Pull failed: "+e.message); }
    };
  }
}

addEventListener("hashchange",nav);
nav();
updateThemeBtn();
