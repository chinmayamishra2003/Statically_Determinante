<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<title>Statically Determinate · IES Civil Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Serif+4:wght@400;600;700&family=Noto+Serif+Devanagari:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf9;--card:#fff;--ink:#14213d;--mut:#6b7b92;--line:#e7e5e4;
  --acc:#1f4e8c;--hi:#e8a317;--ok:#2f8f5b;--urg:#b0281b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1522;--card:#16202f;--ink:#e6ecf5;--mut:#92a3bb;--line:#2a3a52;
    --acc:#6aa5ee;--hi:#f0b93a;--ok:#4cc58a;--urg:#ff8b7a;
    color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#0e1522;--card:#16202f;--ink:#e6ecf5;--mut:#92a3bb;--line:#2a3a52;
  --acc:#6aa5ee;--hi:#f0b93a;--ok:#4cc58a;--urg:#ff8b7a;
  color-scheme:dark
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Archivo,system-ui,sans-serif}
h1,h2,h3,.sans,button,nav a,label,select,input,textarea{font-family:Archivo,system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:2px solid var(--ink);background:var(--card);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.mark{font:800 22px Archivo,sans-serif;border:2px solid var(--ink);padding:2px 9px;background:var(--hi);color:#14213d}
.logo b{display:block;font:800 20px/1.1 Archivo,sans-serif;letter-spacing:-.01em}
.logo small{font:500 12px Archivo,sans-serif;color:var(--mut)}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav a{padding:7px 12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent}
nav a.on{border-color:var(--hi)}
nav a:hover{background:var(--bg)}
#tt{background:transparent;border:1px solid var(--ink);color:var(--ink);padding:7px 12px;font:600 13px Archivo,sans-serif;cursor:pointer;margin-left:8px;white-space:nowrap}
#tt:hover{background:var(--bg)}
main{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
h2{font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
button,.btn{background:var(--ink);color:var(--bg);border:0;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 3px}
.bar{height:8px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1 1 150px}
details{border:1px solid var(--line);background:var(--card);margin-bottom:8px}
summary{padding:10px 14px;font:700 16px Archivo,sans-serif;cursor:pointer}
details>div{padding:4px 14px 12px}
.t{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.t input{width:auto;margin-top:6px}
.f{font-family:'Source Serif 4',serif;background:var(--bg);padding:6px 10px;margin:5px 0;border-left:3px solid var(--hi);overflow-x:auto}
.tag{font:600 12px Archivo,sans-serif;background:var(--bg);border:1px solid var(--line);padding:1px 7px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;font-size:14px}

/* Countdown */
.countdowns{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;margin-bottom:18px
}
.countdown{
  background:var(--card);border:1px solid var(--line);
  padding:18px 14px 16px;text-align:center;
  transition:border-color .2s, box-shadow .2s, opacity .2s
}
.countdown.is-next{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.countdown.is-past{opacity:.55}
.cd-label{
  font:700 12px Archivo,sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut);margin-bottom:12px
}
.cd-num{
  font:800 56px/1 Archivo,sans-serif;color:var(--ink);
  letter-spacing:-.02em;font-variant-numeric:tabular-nums
}
.cd-sub{
  font:600 12px Archivo,sans-serif;color:var(--mut);
  margin-top:8px;text-transform:uppercase;letter-spacing:.08em
}
.cd-done{font:700 16px Archivo,sans-serif;color:var(--ok);padding:26px 0}
.countdown.urgent .cd-num{color:var(--urg)}
@media (max-width:520px){
  .cd-num{font-size:44px}
}

/* Formula images */
.fimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.fimg{margin:0;border:1px solid var(--line);padding:4px;background:var(--bg);break-inside:avoid}
.fimg img{width:100%;height:auto;display:block;background:#fff}
.fimg figcaption{font:600 12px Archivo,sans-serif;color:var(--mut);padding:4px 2px}
.fimg button{font-size:12px;padding:3px 8px;margin:2px}
.addimg[hidden]{display:none}

/* QCAB */
#out{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:16px}
.sheet{width:210mm;height:297mm;background:#fff;color:#111;position:relative;box-shadow:0 1px 8px rgba(0,0,0,.25);overflow:hidden;font-family:'Source Serif 4',serif;flex:none}
.sheet .bd{position:absolute;inset:8mm;border:.4mm solid #7a1f1f}
.sheet small{font:600 6.5pt Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#555}
.rb{display:inline-block;width:5.5mm;height:6.5mm;border:.3mm solid #444;margin-left:1mm;text-align:center;font:600 9pt/6.5mm Archivo,sans-serif;vertical-align:middle;font-style:normal}
.sheet .l1,.sheet .l2{position:absolute;top:6mm;bottom:16mm;width:0;border-left:.35mm solid #000}
.sheet .l1{left:23mm}.sheet .l2{left:185mm}
.sheet .sec{position:absolute;left:23mm;width:162mm;top:8mm;text-align:center;font:700 10.5pt 'Source Serif 4',Georgia,serif}
.sheet .ql{position:absolute;left:8mm;top:20mm;font:700 10.5pt 'Source Serif 4',Georgia,serif}
.sheet .qs{position:absolute;left:25.5mm;top:20mm;font:400 10.5pt 'Source Serif 4',Georgia,serif}
.sheet .qt{position:absolute;left:37mm;width:140mm;top:20mm;z-index:2;background:#fff;font:400 10.5pt/1.75 'Source Serif 4',Georgia,serif;text-align:justify;word-spacing:.12em}
.sheet .qt i{display:block;text-align:right}
.sheet .note{position:absolute;left:186mm;top:7mm;width:21mm;font:400 6.3pt/1.15 'Source Serif 4',Georgia,serif}
.sheet .note b{display:block;font:400 6.3pt/1.2 'Noto Serif Devanagari','Mangal',serif}
.sheet .lines{position:absolute;left:24mm;right:26mm;top:24mm;bottom:18mm;background:repeating-linear-gradient(to bottom,transparent 0 8mm,#b9c7d9 8mm 8.2mm)}
.sheet .ft{position:absolute;left:8mm;right:8mm;bottom:9mm;display:flex;justify-content:space-between;font:400 7.5pt 'Source Serif 4',Georgia,serif}
.sheet .ft b{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:8.5pt}
.sheet .ft em{font-size:6pt;color:#777}
.cov{padding:18mm 20mm}.cov h1{font:800 20pt Archivo,sans-serif;text-align:center;margin:4mm 0 1mm}
.cov .c2{text-align:center;font:500 11pt Archivo,sans-serif;color:#444}
.cov table,.idx table{width:100%;border-collapse:collapse;margin:6mm 0;font:500 10pt Archivo,sans-serif}
.cov td,.cov th,.idx td,.idx th{border:.3mm solid #444;padding:2mm 3mm;text-align:left}
.cov ol{font:400 9.5pt/1.5 'Source Serif 4',serif;margin:3mm 0;padding-left:5mm}
.cov h4,.idx h4{font:700 10pt Archivo,sans-serif;margin:5mm 0 0;text-transform:uppercase;letter-spacing:.05em}
.idx{padding:18mm 20mm}.idx h1{font:800 18pt Archivo,sans-serif;margin:4mm 0}
@media print{
  @page{size:A4;margin:0}
  header,nav,.noprint,.sub,h2{display:none!important}
  body,main{background:#fff;padding:0;margin:0;max-width:none}
  .view:not(#v-qcab){display:none!important}
  #out{margin:0;gap:0;display:block}
  .sheet{box-shadow:none;height:296mm;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
  .sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:none!important}
}

/* v3 modern */
:root{--r:14px;--sh:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.07)}
body{background:radial-gradient(900px 420px at 8% -8%,color-mix(in srgb,var(--acc) 14%,transparent),transparent),var(--bg)}
header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(12px)}
.mark{border-radius:10px;border:0}
.card,details,.countdown,.fimg,.rv{border-radius:var(--r);box-shadow:var(--sh)}
button,.btn,input,select,textarea{border-radius:10px}
a.btn{display:inline-block;text-decoration:none;text-align:center;background:var(--ink);color:var(--bg);padding:8px 14px;font-weight:700;font-size:14px}
a.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
nav a{border-radius:999px;border-bottom:0}nav a.on{background:var(--ink);color:var(--bg)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:20px;margin-bottom:18px}
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative;flex:none}
.ring:before{content:"";position:absolute;inset:8px;background:var(--card);border-radius:50%}.ring b{position:relative;font:800 18px Archivo,sans-serif}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}.chip.on{background:var(--ink);color:var(--bg)}
.rv{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:3px}.dots i.on{background:var(--ok)}
.ed button{font-size:12px;padding:2px 8px;margin-left:4px}
.fimg select{width:auto;max-width:130px;font-size:12px;padding:3px}.fimg img{cursor:zoom-in}
#pb{position:fixed;right:16px;bottom:84px;z-index:40;box-shadow:var(--sh);border-radius:999px;background:var(--hi);color:#14213d;padding:12px 18px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:grid;place-items:center;overflow:auto;cursor:zoom-out}
#lb img{max-width:96vw;max-height:94vh;background:#fff}
@media(max-width:760px){
  header{position:static;backdrop-filter:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;flex-wrap:nowrap;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  nav a{white-space:nowrap}main{padding-bottom:90px}
}
@media print{.ed,#pb{display:none!important}}

/* v4 minimal */
.mark{width:38px;height:38px;padding:0;border:0;background:none;display:block}
body{background:var(--bg)}
.card,details,.countdown,.fimg,.rv,.hero{box-shadow:none;border:1px solid var(--line)}
.card,details{padding:18px}
h2{font-size:28px;letter-spacing:-.02em;margin:6px 0}h3{letter-spacing:-.01em}
.sub{color:var(--mut)}.f{border-left-width:2px;border-radius:0 8px 8px 0}
header{padding:12px 20px}nav a{font-weight:500}
button{cursor:pointer}
.timer{align-items:center;gap:10px}.timer b{font:700 22px/1 Archivo,sans-serif;font-variant-numeric:tabular-nums}
#gso{position:fixed;inset:0;background:rgba(10,15,25,.5);backdrop-filter:blur(4px);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.gsb{width:min(620px,92vw);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#gsr{max-height:55vh;overflow:auto;margin-top:8px}
#gsr a{display:block;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
#gsr a:hover{background:var(--bg)}#gsr small{display:block;color:var(--mut)}
@media(max-width:760px){#gsb{order:2;margin-left:auto}}

/* v5 engineering + sidebar */
body{background-image:linear-gradient(color-mix(in srgb,var(--ink) 4%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ink) 4%,transparent) 1px,transparent 1px);background-size:28px 28px}
h2{display:flex;align-items:center;gap:12px}h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card:hover{border-color:var(--acc)}
.hero{position:relative;overflow:hidden}.trs{position:absolute;right:14px;bottom:6px;width:230px;color:var(--acc);opacity:.14;pointer-events:none}
.tb{max-width:1100px;margin:36px auto 24px;padding:8px 14px;border:1px solid var(--line);font:500 11px Archivo,sans-serif;letter-spacing:.08em;color:var(--mut);text-align:center;border-radius:8px}
#mb,#scrim{display:none}
@media(max-width:760px){
  #mb{display:block;font-size:20px;line-height:1;padding:8px 12px}
  nav{right:auto;width:272px;flex-direction:column;flex-wrap:nowrap;gap:4px;padding:76px 14px 20px;border-top:0;border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s;z-index:70;overflow:auto;top:0}
  nav a{padding:12px 14px;font-size:16px;border-radius:10px}
  nav a::before{display:inline-block;width:1.7em;color:var(--acc);font-weight:700}
  nav a[href="#dash"]::before{content:"▦"}nav a[href="#syl"]::before{content:"≡"}nav a[href="#notes"]::before{content:"✎"}nav a[href="#form"]::before{content:"Σ"}
  nav a[href="#pyq"]::before{content:"?"}nav a[href="#rev"]::before{content:"↻"}nav a[href="#qcab"]::before{content:"▤"}nav a[href="#sync"]::before{content:"⇅"}
  body.nv nav{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.nv #scrim{display:block;position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:65}
  main{padding-bottom:24px}#out{align-items:flex-start;overflow-x:auto;max-width:100vw}.trs{width:150px}
}
@media print{
  .tb,#scrim,#mb{display:none!important}
  main,.view{max-width:none!important;overflow:visible!important;padding:0!important;margin:0!important}
  #out{display:block!important;max-width:none!important;overflow:visible!important;margin:0!important}
  .sheet{width:210mm!important;margin:0!important;overflow:hidden}
}
</style>
</head>

<header>
<button id="mb" class="alt" aria-label="Menu">☰</button>

<script>
/* ---- Theme toggle (light default, dark persists) ---- */
(function(){
  try{
    var saved = localStorage.getItem('theme');
    if(saved === 'dark' || saved === 'light'){
      document.documentElement.setAttribute('data-theme', saved);
    }
  }catch(e){}
})();
function currentTheme(){
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}
function updateThemeBtn(){
  var b = document.getElementById('tt');
  if(!b) return;
  b.textContent = currentTheme() === 'dark' ? '☀ Light' : '🌙 Dark';
}
document.getElementById('tt').addEventListener('click', function(){
  var next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('theme', next); }catch(e){}
  updateThemeBtn();
});

/* ---- Subjects data ---- */
const SUB=[
{n:"Building Materials & Construction",t:"Timber, bricks, stones, lime, cement & admixtures;Cement concrete: mix design, workability, strength, durability;Steel, aluminium, glass, plastics, bitumen, paints;Masonry, plastering, flooring, roofing;Building services basics",note:"Concrete strength depends mainly on w/c ratio (Abrams). Know IS 10262 mix design steps and curing effects.",f:["Abrams: fc = A / B^(w/c)","Modulus of rupture fcr = 0.7√fck (MPa)","Ec = 5000√fck (MPa)","Young’s modulus of steel Es = 2×10⁵ MPa"]},
{n:"Solid Mechanics",t:"Elastic constants, stress-strain, thermal stresses;Principal stresses & Mohr’s circle;Bending & shear stress in beams;Torsion of shafts;Columns & struts, Euler/Rankine;Thin & thick cylinders;Theories of failure;Strain energy, unsymmetrical bending, shear centre",note:"Draw Mohr’s circle neatly with sign convention stated. Always check slenderness before choosing Euler vs Rankine.",f:["σ = My/I , τ = VAȲ/(Ib)","E = 2G(1+μ) = 3K(1−2μ)","Euler: Pcr = π²EI/Le²","T/J = τ/r = Gθ/L","τmax = √(((σx−σy)/2)²+τxy²)","Thin cylinder: σh = pd/2t , σl = pd/4t"]},
{n:"Structural Analysis",t:"Determinacy & stability, trusses;Moment distribution, slope-deflection;Stiffness & flexibility matrix methods;Influence lines & moving loads;Arches & cables;Energy methods, Castigliano, unit load;Plastic analysis of beams & frames",note:"Choose the method by degree of indeterminacy: kinematic DoF small → slope-deflection/stiffness; static DoF small → force method.",f:["Ds = 3m + r − 3j (plane truss: m+r−2j)","Slope-deflection: M = 4EIθ/L + FEM","Distribution factor = k/Σk","δ = ∫ M m dx / EI (unit load)","Plastic: Mp = σy·Z , shape factor = Z/S"]},

{n:"Design of Concrete & Masonry",t:"Limit state design: flexure, shear, torsion, bond (IS 456);Singly/doubly reinforced & flanged beams;Slabs: one-way, two-way, flat;Columns, footings;Prestressed concrete: losses, analysis;Masonry design",note:"Always write xu,max/d limits and state assumptions. Prestress losses table is a frequent short question.",f:["Mu = 0.87 fy Ast d (1 − Ast fy/(b d fck))","xu,max/d = 0.48 (Fe415), 0.46 (Fe500)","τv = Vu/(bd)","Ld = φ·0.87fy/(4τbd)","Pu = 0.4 fck Ac + 0.67 fy Asc"]},

/* ---- IST days-remaining helpers ---- */
function istDateStr(d){
  const parts = new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Kolkata", year:"numeric", month:"2-digit", day:"2-digit"
  }).formatToParts(d);
  const y = parts.find(p=>p.type==='year').value;
  const m = parts.find(p=>p.type==='month').value;
  const dd = parts.find(p=>p.type==='day').value;
  return y+"-"+m+"-"+dd;
}
function daysUntilIST(targetISO){
  const a = Date.parse(istDateStr(new Date())+"T00:00:00Z");
  const b = Date.parse(targetISO+"T00:00:00Z");
  return Math.round((b-a)/86400000);
}

function dueList(){
  const o=[];
  SUB.forEach((s,i)=>s.t.split(";").forEach((t,j)=>{
    const r=st.done[i+"."+j];
    if(r){
      const due=addDays(r.d,INT[Math.min(r.s,INT.length-1)]);
      o.push({i,j,t,s:s.n,due,od:due<=today()});
    }
  }));
  return o.sort((a,b)=>a.due<b.due?-1:1);
}
function pct(i){
  const n=SUB[i].t.split(";").length;
  let c=0;
  for(let j=0;j<n;j++) if(st.done[i+"."+j]) c++;
  return [c,n];
}

function renderCountdowns(){
  const counts = EXAMS.map(e => ({name:e.name, label:e.label, d:daysUntilIST(e.date)}));
  const upcoming = counts.filter(x=>x.d>0).sort((a,b)=>a.d-b.d);
  const nearest = upcoming.length ? upcoming[0].name : null;
  return counts.map(x=>{
    const done   = x.d <= 0;
    const urgent = x.d > 0 && x.d < 30;
    const isNext = x.name === nearest;
    return `<div class="countdown ${done?'is-past':''} ${urgent?'urgent':''} ${isNext?'is-next':''}">
      <div class="cd-label">${x.name} · ${x.label}</div>
      ${done
        ? `<div class="cd-done">${x.name} is here — all the best!</div>`
        : `<div class="cd-num">${x.d}</div><div class="cd-sub">Days to go · IST</div>`}
    </div>`;
  }).join("");
}

const CFG=()=>Object.assign({repo:"chinmayamishra2003/Statically_Determinante",branch:"main",tok:""},st.cloud||{});
let LIB={items:[],sha:null};const PREV={};
const ghH=()=>({Authorization:"Bearer "+CFG().tok,Accept:"application/vnd.github+json"});
const api=p=>"https://api.github.com/repos/"+CFG().repo+"/contents/"+p;
const b64=t=>{let b="";new TextEncoder().encode(t).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
const unb64=t=>new TextDecoder().decode(Uint8Array.from(atob(t.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const fmsg=t=>{const e=document.querySelector("#fm");if(e)e.textContent=t};
async function ghPut(path,content,sha,message){
  const r=await fetch(api(path),{method:"PUT",headers:ghH(),body:JSON.stringify({message,content,branch:CFG().branch,...(sha?{sha}:{})})});
  const j=await r.json();
  if(!r.ok){const e=new Error(j.message||r.status);e.status=r.status;throw e}
  return j;
}
async function loadLib(){
  try{
    if(CFG().tok){
      const r=await fetch(api("data/library.json")+"?ref="+CFG().branch,{headers:ghH()});
      if(r.status==404){LIB={items:[],sha:null};return}
      const j=await r.json(); if(!r.ok)throw new Error(j.message);
      LIB={items:JSON.parse(unb64(j.content)).items||[],sha:j.sha};
    }else{
      const r=await fetch("data/library.json");
      LIB={items:r.ok?((await r.json()).items||[]):[],sha:null};
    }
  }catch(e){fmsg("Could not load library: "+e.message)}
}
async function saveLib(fn){
  for(let n=0;n<2;n++){
    await loadLib();
    const items=fn(LIB.items.slice());
    try{
      const j=await ghPut("data/library.json",b64(JSON.stringify({v:1,items})),LIB.sha,"Update library");
      LIB={items,sha:j.content.sha};return;
    }catch(e){if(n||e.status!=409)throw e}
  }
}
function shrink(file,max=2200){
  return new Promise((ok,no)=>{
    const im=new Image(),u=URL.createObjectURL(file);
    im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.88));
    };
    im.onerror=()=>no(new Error("Could not read this image"));im.src=u;
  });
}
async function addImgs(files,sub){
  const add=[];
  for(const f of files){
    const url=await shrink(f),id=Date.now().toString(36)+Math.random().toString(36).slice(2,5),path="uploads/formulas/"+id+".jpg";
    fmsg("Uploading "+(add.length+1)+"/"+files.length+"…");
    await ghPut(path,url.split(",")[1],null,"Add formula image");
    PREV[id]=url;add.push({id,sub,title:f.name.replace(/\.[^.]+$/,""),path,t:today()});
  }
  await saveLib(a=>a.concat(add));
}
const setImg=(id,p)=>saveLib(a=>a.map(x=>x.id==id?{...x,...p}:x));
async function delImg(id){
  const x=LIB.items.find(i=>i.id==id);if(!x)return;
  const r=await fetch(api(x.path)+"?ref="+CFG().branch,{headers:ghH()});
  if(r.ok){
    const j=await r.json();
    const d=await fetch(api(x.path),{method:"DELETE",headers:ghH(),body:JSON.stringify({message:"Delete formula image",sha:j.sha,branch:CFG().branch})});
    if(!d.ok)throw new Error((await d.json()).message);
  }
  await saveLib(a=>a.filter(i=>i.id!=id));
}

    }).join("");

  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>confirm("Delete this image for everyone?")&&run("Deleting…",()=>delImg(b.dataset.del)));
  document.querySelectorAll("[data-ic]").forEach(b=>b.onclick=()=>{const x=LIB.items.find(i=>i.id==b.dataset.ic),v=prompt("Caption",x.title||"");if(v!==null)run("Saving…",()=>setImg(x.id,{title:v}))});
  document.querySelectorAll("[data-it]").forEach(b=>b.onchange=()=>run("Saving…",()=>setImg(b.dataset.it,{top:+b.value})));
}

async function formLib(){
  const fi=$("#fi"),own=!!CFG().tok;
  document.querySelectorAll(".addimg").forEach(b=>{b.hidden=!own;b.onclick=()=>{fi.dataset.sub=b.dataset.add;fi.click()}});

  fi.onchange=e=>{const f=[...e.target.files];e.target.value="";if(f.length)up(f,+fi.dataset.sub)};
  if(own){

    editForm();

  fmsg("Loading images…");await loadLib();if($("#fm")&&$("#fm").textContent=="Loading images…")fmsg("");drawImgs();
}

    c.querySelector(".addimg").insertAdjacentHTML("afterend",`<button class="alt noprint" data-fa="${i}">+ Formula</button>`);

function showPub(){

function editSyl(){

    box.querySelectorAll(".t").forEach((l,j)=>l.insertAdjacentHTML("beforeend",`<span class="ed"><button class="alt" data-a="rt" data-j="${j}">✎</button><button class="alt" data-a="dt" data-j="${j}">✕</button></span>`));
    box.querySelectorAll("[data-a]").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();synEdit(i,b.dataset.a,+b.dataset.j)});
  });

function synEdit(i,a,j){
  const s=SUB[i],T=s.t.split(";"),c=v=>v.replace(/;/g,",");
  if(a=="rn"){const v=prompt("Subject name",s.n);if(!v)return;s.n=v}
  else if(a=="at"){const v=prompt("New topic");if(!v)return;T.push(c(v));s.t=T.join(";")}
  else if(a=="rt"){const v=prompt("Topic",T[j]);if(!v)return;T[j]=c(v);s.t=T.join(";")}
  else if(a=="dt"){
    if(!confirm("Delete this topic?"))return;
    T.splice(j,1);s.t=T.join(";");
    for(let k=j;k<=T.length;k++){const o=st.done[i+"."+(k+1)];if(o)st.done[i+"."+k]=o;else delete st.done[i+"."+k]}
  }
  dirty();nav();
}

const $=s=>document.querySelector(s), $n=$("#nav"), $m=$("#main");

function nav(){
  const h=(location.hash||"#dash").slice(1);

  $n.innerHTML=TABS.map(([a,b])=>`<a href="#${a}" class="${a==k?"on":""}">${b}</a>`).join("");
  $m.innerHTML=`<section class="view" id="v-${k}">${V[k]()}</section>`;
  bind(k);
  window.scrollTo(0,0);
}

function bind(k){
  if(k=="dash") $("#exam").onchange=e=>{st.exam=e.target.value;save();nav()};

    save();
  });

  if(k=="form"){
    $("#fq").oninput=e=>{
      const q=e.target.value.toLowerCase();

    };
    formLib();

  if(k=="rev") document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const r=st.done[b.dataset.r]; r.d=today(); r.s++; save(); nav();
  });

  if(k=="pyq"){
    const draw=()=>{
      const q=($("#pf").value||"").toLowerCase();
      $("#pl").innerHTML="<tr><th>Year</th><th>Paper</th><th>Marks</th><th>Question</th><th>Solved</th><th></th></tr>"+
        st.pyq.map((p,i)=>({p,i}))
          .filter(({p})=>(p.y+p.pp+SUB[p.s].n+p.q).toLowerCase().includes(q))
          .map(({p,i})=>`<tr><td>${p.y}</td><td>${esc(p.pp)}</td><td>${p.m}</td><td>${esc(p.q)}<br><span class="tag">${esc(SUB[p.s].n)}</span></td><td><input type="checkbox" data-s="${i}" ${p.ok?"checked":""}></td><td><button class="alt" data-x="${i}">Delete</button></td></tr>`).join("");
      document.querySelectorAll("[data-s]").forEach(c=>c.onchange=()=>{st.pyq[c.dataset.s].ok=c.checked;save()});
      document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{st.pyq.splice(b.dataset.x,1);save();draw()});
    };
    $("#pf").oninput=draw;
    $("#padd").onclick=()=>{
      const q=$("#pt").value.trim(); if(!q)return;
      st.pyq.push({y:$("#py").value,pp:$("#pp").value,m:$("#pm").value,s:+$("#ps").value,q,ok:false});
      $("#pt").value=""; save(); draw();
    };
    draw();
  }

  if(k=="qcab") $("#qg").onclick=()=>{
    const PG={6:2,8:2,12:3,20:4},pages=m=>PG[m]||Math.min(4,Math.max(2,Math.ceil(m/6))),opt=id=>$("#"+id).checked;
    let sec=$("#qx").value.trim(),Q=[];
    $("#ql").value.split("\n").forEach(l=>{l=l.trim();if(l[0]=="#"){sec=l.slice(1).trim();return}const a=l.split("|").map(x=>x.trim());if(a.length>=3&&a[0])Q.push({no:a[0],m:+a[1]||12,t:a.slice(2).join(" | "),sec})});
    if(!Q.length)Q=[{no:$("#qn").value,m:+$("#qm").value,t:$("#qt").value.trim(),sec}];
    const sub=esc($("#qs").value),code=esc($("#qc").value),roll=$("#qr").value.trim(),nm=esc($("#qa").value),dt=esc($("#qd").value);
    st.qc={s:$("#qs").value,c:$("#qc").value,x:$("#qx").value,r:roll,a:$("#qa").value,d:$("#qd").value};save();
    let N=0;Q.forEach(q=>{q.n=pages(q.m);q.s=N+1;N+=q.n});
    const boxes=r=>Array.from({length:7},(_,i)=>`<i class="rb">${esc(r[i]||"")}</i>`).join("");
    const tot=Q.reduce((a,q)=>a+q.m,0);
    let h="";
    if(opt("oc"))h+=`<div class="sheet cov"><div class="bd"></div><small>Practice booklet</small><h1>QUESTION-CUM-ANSWER BOOKLET</h1><p class="c2">${sub}</p>
      <table><tr><th>Roll No.</th><td>${boxes(roll)}</td><th>Date</th><td>${dt}</td></tr><tr><th>Name</th><td colspan="3">${nm}</td></tr><tr><th>Candidate's signature</th><td></td><th>Invigilator's signature</th><td></td></tr></table>
      <h4>Instructions</h4><ol><li>Write your Roll No. in the boxes above before you start.</li><li>Use only a blue or black pen. Do not write on the margin to the right.</li><li>Begin each answer on the page that carries its question number.</li><li>Strike out any unused pages with a diagonal line.</li><li>Draw neat sketches with a pencil and label them.</li><li>Write the question number clearly at the start of every answer.</li></ol>
      <h4>For examiner's use only</h4><table><tr><th>Q. No.</th><th>Max marks</th><th>Marks awarded</th></tr>${Q.slice(0,12).map(q=>`<tr><td>${esc(q.no)}</td><td>${q.m}</td><td></td></tr>`).join("")}<tr><th>Total</th><th>${tot}</th><td></td></tr></table></div>`;
    if(opt("oi"))h+=`<div class="sheet idx"><div class="bd"></div><small>Practice booklet</small><h1>Index of questions</h1><table><tr><th>Sr.</th><th>Q. No.</th><th>Question</th><th>Marks</th><th>Page</th></tr>${Q.slice(0,24).map((q,i)=>`<tr><td>${i+1}</td><td>${esc(q.no)}</td><td>${esc(q.t.slice(0,70)||"-")}</td><td>${q.m}</td><td>${q.s}</td></tr>`).join("")}</table></div>`;
    let pg=0,prev=null;
    Q.forEach(q=>{
      const [lb,...sp]=q.no.split(/\s+/),showSec=q.sec&&q.sec!==prev;prev=q.sec;
      for(let p=1;p<=q.n;p++){pg++;
        h+=`<div class="sheet"><i class="l1"></i><i class="l2"></i>${opt("ol")?'<div class="lines"></div>':""}
        ${p==1&&showSec?`<div class="sec">${esc(q.sec)}</div>`:""}
        ${opt("om")?'<div class="note"><b>उम्मीदवारों को इस हाशिए में नहीं लिखना चाहिए</b>Candidates must not write on this margin</div>':""}
        ${p==1?`<div class="ql">Q${esc(lb)}</div><div class="qs">${esc(sp.join(" "))}</div><div class="qt">${esc(q.t)}<i>${q.m}</i></div>`:""}
        <div class="ft"><span>${code}</span><b>${pg}</b><em>Practice copy</em></div></div>`}
    });
    $("#out").innerHTML=h;
  };

  if(k=="sync"){
    $("#ex").onclick=()=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([JSON.stringify({...st,cloud:undefined,gt:undefined})],{type:"application/json"}));
      a.download="sd-backup-"+today()+".json";
      a.click();
    };
    $("#im").onchange=e=>{
      const r=new FileReader();
      r.onload=()=>{
        try{
          st=Object.assign({done:{},pyq:[],cloud:st.cloud},JSON.parse(r.result),{cloud:st.cloud});
          save(); $("#gm").textContent=""; alert("Imported");
        }catch(x){ alert("Not a valid backup file"); }
      };
      r.readAsText(e.target.files[0]);
    };
    const cm=t=>$("#cm").textContent=t;
    $("#cs").onclick=()=>{st.cloud={repo:$("#cr").value.trim(),branch:$("#cb").value.trim()||"main",tok:$("#ct").value.trim()};save();cm("Saved on this device.")};
    $("#cp").onclick=async()=>{
      try{
        if(!CFG().tok)throw new Error("save a token first");
        const r=await fetch(api("data/shared.json")+"?ref="+CFG().branch,{headers:ghH()});
        const sha=r.ok?(await r.json()).sha:null;
        await ghPut("data/shared.json",b64(JSON.stringify({v:1,pyq:st.pyq})),sha,"Publish shared PYQs");
        cm("Published. Visitors can load it after the site rebuilds.");
      }catch(e){cm("Failed: "+e.message)}
    };
    $("#cl").onclick=async()=>{
      try{
        const r=await fetch("data/shared.json");if(!r.ok)throw new Error("nothing published yet");
        const d=await r.json(),key=p=>[p.y,p.pp,p.q].join("|"),have=new Set(st.pyq.map(key));let n=0;
        (d.pyq||[]).forEach(p=>{if(SUB[p.s]&&!have.has(key(p))){st.pyq.push(p);n++}});
        save();cm(n+" new questions added.");
      }catch(e){cm("Failed: "+e.message)}
    };
    const msg=t=>$("#gm").textContent=t;
    const H=()=>({Authorization:"Bearer "+$("#gt").value,Accept:"application/vnd.github+json"});
    $("#gp").onclick=async()=>{
      try{
        st.gt=$("#gt").value;
        const body={description:"Statically Determinate backup",public:false,files:{"sd.json":{content:JSON.stringify({...st,gt:undefined,cloud:undefined})}}};
        const id=$("#gi").value;
        const r=await fetch("https://api.github.com/gists"+(id?"/"+id:""),{method:id?"PATCH":"POST",headers:H(),body:JSON.stringify(body)});
        const j=await r.json(); if(!r.ok) throw new Error(j.message);
        st.gi=j.id; save(); $("#gi").value=j.id; msg("Pushed. Gist id: "+j.id);
      }catch(e){ msg("Push failed: "+e.message); }
    };
    $("#gl").onclick=async()=>{
      try{
        const r=await fetch("https://api.github.com/gists/"+$("#gi").value,{headers:H()});
        const j=await r.json(); if(!r.ok) throw new Error(j.message);
        const d=JSON.parse(j.files["sd.json"].content);
        st=Object.assign(st,d); save(); msg("Pulled latest data.");
      }catch(e){ msg("Pull failed: "+e.message); }
    };
  }
}

function gsearch(q){
  const o=[],has=t=>(t||"").toLowerCase().includes(q);
  SUB.forEach(s=>{
    s.t.split(";").forEach(t=>has(t)&&o.push(["Topic",t,s.n,"syl"]));
    s.f.forEach(f=>has(f)&&o.push(["Formula",f,s.n,"form"]));
    if(has(s.note))o.push(["Note",s.note.slice(0,90),s.n,"notes"]);
  });
  (st.pyq||[]).forEach(p=>has(p.q)&&o.push(["PYQ",String(p.q).slice(0,90),p.y||"","pyq"]));
  LIB.items.forEach(x=>has(x.title)&&o.push(["Image",x.title,SUB[x.sub]?SUB[x.sub].n:"","form"]));
  return o.slice(0,30);
}
function openGS(){
  if($("#gso"))return;
  const o=document.createElement("div");o.id="gso";
  o.innerHTML='<div class="gsb"><input id="gsi" placeholder="Search topics, formulas, notes, PYQs, images…" autocomplete="off"><div id="gsr"></div></div>';
  o.onclick=e=>{if(e.target==o||e.target.closest("#gsr a"))o.remove()};
  document.body.appendChild(o);
  const i=$("#gsi"),r=$("#gsr");i.focus();
  i.oninput=()=>{const q=i.value.trim().toLowerCase();if(q.length<2){r.innerHTML="";return}
    r.innerHTML=gsearch(q).map(x=>`<a href="#${x[3]}"><span class="tag">${x[0]}</span> ${esc(x[1])}<small>${esc(x[2])}</small></a>`).join("")||'<p class="sub">No matches.</p>'};
}
addEventListener("keydown",e=>{

  if(e.key=="Escape"&&$("#gso"))$("#gso").remove();
  else if((e.key=="/"&&!typing)||((e.ctrlKey||e.metaKey)&&e.key=="k")){e.preventDefault();openGS()}
});
function streak(){
  const d=new Set(st.days||[]);let n=0;
  for(let k=0;k<400;k++){if(d.has(iso(new Date(Date.now()-k*864e5))))n++;else if(k>0)break}
  return n;
}
let TI=null,TL=1500;
function tick(){const m=$("#tm");if(m)m.textContent=String(Math.floor(TL/60)).padStart(2,"0")+":"+String(TL%60).padStart(2,"0");const b=$("#tb");if(b)b.textContent=TI?"Pause":"Focus"}
function toggleT(){
  if(TI){clearInterval(TI);TI=null}
  else TI=setInterval(()=>{
    TL--;tick();
    if(TL<=0){clearInterval(TI);TI=null;TL=1500;st.focus=st.focus||{};st.focus[today()]=(st.focus[today()]||0)+1;save();alert("Focus session done. Take a 5 minute break.");nav()}
  },1000);
  tick();
}
